name: ML
channels:
  - conda-forge
dependencies:
  - python>=3.13,<3.14

  - mypy
  - debugpy
  - types-requests
  - isodate

  - requests

  - numpy
  - scipy
  - einops
  - iopath
  - tqdm

  - matplotlib

  - isort
  - black
  - autoflake

  - boto3
  - nibabel
  - awscli

  - psutil
  - py-cpuinfo
  - gputil
  - libtmux

  - pip
  - pip:
      - --index-url=https://download.pytorch.org/whl/cu130
      - torch
      - torchvision
      - torchaudio
  - pip:
      - --index-url=https://pypi.org/simple
      - torchinfo
      - fvcore
      - safetensors
